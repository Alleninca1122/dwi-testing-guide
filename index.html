<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEMO Galvanizing DWI User Testing Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f172a;
    --surface: #1e293b;
    --surface-card: #0f172a;
    --border: #334155;
    --border-light: #1e293b;
    
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    
    --accent: #38bdf8;
    --ok: #10b981;
    --ok-bg: rgba(16, 185, 129, 0.12);
    --amber: #f59e0b;
    --amber-bg: rgba(245, 158, 11, 0.12);
    --err: #ef4444;
    --err-bg: rgba(239, 68, 68, 0.12);

    --sans: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    --mono: "JetBrains Mono", monospace;
    --radius: 12px;
  }

  * { box-sizing: border-box; }
  
  body {
    margin: 0;
    background-color: var(--bg);
    background-image: 
      radial-gradient(at 50% 0%, rgba(56, 189, 248, 0.05) 0px, transparent 70%),
      radial-gradient(at 0% 100%, rgba(16, 185, 129, 0.03) 0px, transparent 50%);
    font-family: var(--sans);
    color: var(--text-primary);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 800px;
    margin: 0 auto;
    padding: 64px 24px 96px;
  }

  header {
    margin-bottom: 40px;
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .eyebrow::before {
    content: "";
    display: inline-block;
    width: 6px;
    height: 6px;
    background: var(--accent);
    border-radius: 50%;
  }

  h1 {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0;
    color: #ffffff;
  }

  /* Section Styling */
  .section-block {
    margin-bottom: 40px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
  }

  .section-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 12px;
  }

  .section-number {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    background: rgba(56, 189, 248, 0.1);
    border: 1px solid rgba(56, 189, 248, 0.2);
    padding: 2px 8px;
    border-radius: 6px;
  }

  .section-title {
    font-size: 18px;
    font-weight: 600;
    color: #ffffff;
    margin: 0;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .instruction-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 24px;
    font-size: 14.5px;
    color: var(--text-secondary);
    line-height: 1.6;
  }

  .instruction-card code {
    font-family: var(--mono);
    color: var(--accent);
    background: rgba(56, 189, 248, 0.1);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 13.5px;
  }

  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 16px;
    background: var(--bg);
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-secondary);
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-muted);
    transition: all 0.3s ease;
  }
  .dot.live {
    background: var(--ok);
    box-shadow: 0 0 10px var(--ok);
  }
  .dot.err {
    background: var(--err);
    box-shadow: 0 0 10px var(--err);
  }

  .right-tools {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .updated {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--text-muted);
  }

  button.refresh {
    font-family: var(--sans);
    font-weight: 600;
    font-size: 12.5px;
    background: var(--accent);
    color: #0f172a;
    border: none;
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s ease;
  }
  button.refresh:hover {
    background: #7dd3fc;
  }
  button.refresh svg {
    width: 13px;
    height: 13px;
  }

  .table-container {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
  }

  th {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.02);
  }

  td {
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-primary);
  }

  tr:last-child td {
    border-bottom: none;
  }

  tr.occupied td {
    background: rgba(245, 158, 11, 0.03);
  }

  td.role {
    text-transform: capitalize;
    font-family: var(--sans);
    color: var(--text-secondary);
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--sans);
    font-size: 11.5px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 999px;
  }

  .badge.available {
    background: var(--ok-bg);
    color: #34d399;
    border: 1px solid rgba(16, 185, 129, 0.2);
  }

  .badge.occupied {
    background: var(--amber-bg);
    color: #fbbf24;
    border: 1px solid rgba(245, 158, 11, 0.2);
  }

  .badge .bdot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: currentColor;
  }

  footer {
    margin-top: 40px;
    font-size: 12.5px;
    color: var(--text-muted);
    border-top: 1px solid var(--border);
    padding-top: 20px;
    line-height: 1.7;
  }

  footer code {
    font-family: var(--mono);
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--accent);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 11.5px;
  }

  .loading, .error {
    font-family: var(--mono);
    font-size: 13px;
    padding: 24px 18px;
    text-align: center;
  }
  .loading { color: var(--text-secondary); }
  .error { color: #f87171; background: var(--err-bg); }

  @media (max-width: 640px) {
    .wrap { padding: 32px 16px; }
    td, th { padding: 10px 12px; }
    .toolbar { flex-direction: column; align-items: stretch; }
    .right-tools { justify-content: space-between; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Shop-Floor Portal · Demo</div>
    <h1>DEMO Galvanizing DWI User Testing Guide</h1>
  </header>

  <!-- SECTION 01: LOGIN -->
  <section class="section-block">
    <div class="section-header">
      <span class="section-number">01</span>
      <h2 class="section-title">Login Instructions</h2>
    </div>
    
    <div class="instruction-card">
      Please select an available <strong>Employee ID</strong> from the status table below to log in. Use the initial PIN: <code>1234</code>
    </div>

    <div class="toolbar">
      <div class="status">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">connecting…</span>
      </div>
      <div class="right-tools">
        <span class="updated" id="lastUpdated">last checked —</span>
        <button class="refresh" id="refreshBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
          Refresh
        </button>
      </div>
    </div>

    <div class="table-container">
      <div id="content">
        <div class="loading">Fetching current status…</div>
      </div>
    </div>
  </section>

  <footer>
    Source: <code id="srcUrl"></code>/rest/v1/employees — read-only, anon key.
  </footer>
</div>

<script>
  const SUPABASE_URL = "https://gaseaioxmxbrtarhjhdq.supabase.co";
  const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdhc2VhaW94bXhicnRhcmhqaGRxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5NDk5MjEsImV4cCI6MjEwMDUyNTkyMX0.PQGpNrxDk_Az1SckwKFnDgX7BOaQn_79n3eLSMCmD-c";

  document.getElementById("srcUrl").textContent = SUPABASE_URL;

  const dot = document.getElementById("statusDot");
  const statusText = document.getElementById("statusText");
  const content = document.getElementById("content");
  const lastUpdated = document.getElementById("lastUpdated");

  async function fetchAccounts(){
    dot.className = "dot";
    statusText.textContent = "connecting…";
    try{
      const res = await fetch(`${SUPABASE_URL}/rest/v1/employees?select=employee_id,pin,role&order=employee_id.asc`, {
        headers: {
          "apikey": ANON_KEY,
          "Authorization": `Bearer ${ANON_KEY}`
        }
      });
      if(!res.ok) throw new Error(`HTTP ${res.status}`);
      const rows = await res.json();
      render(rows);
      dot.className = "dot live";
      statusText.textContent = "live";
      lastUpdated.textContent = "last checked " + new Date().toLocaleTimeString();
    }catch(err){
      dot.className = "dot err";
      statusText.textContent = "connection failed";
      content.innerHTML = `<div class="error">Could not reach the database: ${err.message}. Open this file directly in a browser (not inside a sandboxed preview) with network access to supabase.co.</div>`;
    }
  }

  function render(rows){
    const isOccupied = r => r.pin !== "1234";

    const rowsHtml = rows.map(r => {
      const occ = isOccupied(r);
      return `<tr class="${occ ? 'occupied' : ''}">
        <td>${r.employee_id}</td>
        <td class="role">${r.role}</td>
        <td>
          <span class="badge ${occ ? 'occupied' : 'available'}">
            <span class="bdot"></span>${occ ? 'Occupied' : 'Available'}
          </span>
        </td>
      </tr>`;
    }).join("");

    content.innerHTML = `<table>
      <thead><tr><th>Employee ID</th><th>Role</th><th>Status</th></tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>`;
  }

  document.getElementById("refreshBtn").addEventListener("click", fetchAccounts);
  fetchAccounts();
</script>
</body>
</html>
